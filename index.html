<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RU.PDF | Просмотр документа</title>
    <style>
        :root {
            --bg: #0b0f1a;
            --panel: #161b2b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            background: var(--panel);
            padding: 0 20px;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(56, 189, 248, 0.3);
        }

        .logo {
            font-weight: 800;
            color: var(--accent);
            cursor: pointer;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .nav-btns button {
            background: var(--accent);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .post-container {
            width: 100%;
            max-width: 750px;
            background: var(--panel);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #textDisplay { line-height: 1.6; font-size: 1.1rem; white-space: pre-wrap; }
        .post-img { width: 100%; border-radius: 8px; margin: 20px 0; display: none; }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            padding: 20px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8;
            font-size: 0.9rem;
        }

        /* КОММЕНТАРИИ */
        .comment-block { margin-top: 30px; }
        .comment-item { 
            background: rgba(255,255,255,0.03); 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 15px;
            border-left: 3px solid var(--accent);
        }
        .comment-user { font-weight: bold; color: var(--accent); margin-bottom: 5px; display: block; }

        /* ОКНО РЕГИСТРАЦИИ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .reg-box {
            background: var(--panel);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <nav class="header">
        <div class="logo" onclick="showReg()">RU.PDF</div>
        <div class="nav-btns">
            <button onclick="showReg()">Войти / Регистрация</button>
        </div>
    </nav>

    <div class="main-content">
        <div class="post-container">
            
            <div id="postContent">
                <p id="textDisplay">Загрузка документа...</p>
                <img src="" id="imgDisplay" class="post-img">
            </div>

            <div class="stats">
                <span>👁 Просмотры: <b id="viewCount">0</b></span>
                <span>❤️ Лайки: <b id="likeCount">0</b></span>
            </div>

            <div class="comment-block">
                <h4>Комментарии:</h4>
                <div id="commentList">
                    </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="regModal">
        <div class="reg-box">
            <h2>Доступ ограничен</h2>
            <p>Чтобы просматривать защищенные PDF-файлы, ваша учетная запись должна быть одобрена администратором.</p>
