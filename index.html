<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RU.PDF | Просмотр</title>
    <style>
        :root {
            --bg: #0b0f1a;
            --panel: #161b2b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            background: var(--panel);
            padding: 0 20px;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(56, 189, 248, 0.3);
            position: sticky;
            top: 0;
            z-index: 999;
        }

        .logo { font-weight: 800; color: var(--accent); cursor: pointer; font-size: 1.2rem; }

        .nav-btns button {
            background: var(--accent);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .post-container {
            width: 100%;
            max-width: 750px;
            background: var(--panel);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Название файла */
        .file-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        /* Текст в столбик */
        #textDisplay { 
            line-height: 1.8; 
            font-size: 1.05rem; 
            white-space: pre-line; /* Сохраняет переносы строк */
            margin-bottom: 25px;
            color: #cbd5e1;
        }

        /* Миниатюра фото */
        .img-wrapper {
            max-width: 200px;
            border: 2px solid var(--accent);
            border-radius: 8px;
            overflow: hidden;
            cursor: zoom-in;
            transition: 0.3s;
            margin-bottom: 20px;
        }
        .img-wrapper:hover { transform: scale(1.02); box-shadow: 0 0 15px var(--accent); }
        .post-img { width: 100%; display: none; }

        .stats {
            display: flex;
            gap: 25px;
            margin-top: 30px;
            padding: 20px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .stats b { color: var(--text); }

        .comment-item { 
            background: rgba(255,255,255,0.03); 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 15px;
            border-left: 3px solid var(--accent);
        }
        .comment-user { font-weight: bold; color: var(--accent); display: block; margin-bottom: 5px; }

        /* Модальные окна */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reg-box {
            background: var(--panel);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            border: 1px solid var(--accent);
        }

        /* Полноразмерное фото */
        #fullImg { max-width: 100%; max-height: 90vh; border-radius: 5px; }
    </style>
</head>
<body>

    <nav class="header">
        <div class="logo" id="logoBtn">RU.PDF</div>
        <div class="nav-btns">
            <button id="regBtn">Войти / Регистрация</button>
        </div>
    </nav>

    <div class="main-content">
        <div class="post-container">
            <div class="file-title" id="fileTitle">Загрузка...</div>
            
            <div id="postContent">
                <p id="textDisplay">Загрузка данных...</p>
                
                <div class="img-wrapper" id="imgClick">
                    <img src="" id="imgDisplay" class="post-img">
                </div>
            </div>

            <div class="stats">
                <span>👁 Просмотры: <b id="viewCount">...</b></span>
                <span>❤️ Лайки: <b id="likeCount">...</b></span>
            </div>

            <div class="comment-block">
                <h4>Комментарии:</h4>
                <div id="commentList"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="regModal">
        <div class="reg-box">
            <h2>Доступ ограничен</h2>
            <p>Учетная запись должна быть одобрена администратором.</p>
            <button id="closeModalBtn" style="width:100%; padding:12px; background:var(--accent); border:none; border-radius:8px; cursor:pointer; font-weight:bold; margin-top:15px;">Понятно</button>
        </div>
    </div>

    <div class="modal-overlay" id="imgModal">
        <img src="" id="fullImg">
    </div>

    <script>
        // --- ТВОИ ДАННЫЕ (МЕНЯТЬ ТУТ) ---
        const MY_DOCUMENT = {
            title: "Файл: PDF - Ярослав", // Название файла сверху
            text: `ФИО: Ярослав С.
Паспорт: 123.123.123
Дата выдачи: 12.05.2022
Телефон: +7 (900) --- -- --
Адрес: ул. Связистов, д. 10`, // Текст в столбик (используй обратные кавычки ``)
            
            image: "a8ogt1bqlh5xjp1mxidl (1).png", 
            
            comments: [
                { user: "User_12309", text: "Думаю можно на этого пдф микрозаймов взять, ахуели совсем уже." },
                { user: "User_9385395", text: "Ебать хорошо сработали парни, выгружайте полный доступ!" },
                { user: "User_937567", text: "Жду когда уже можно будет работать, заливайте в тгк." }
            ]
        };

        // Логика статистики
        function updateStats() {
            let views = parseInt(localStorage.getItem('pdf_views_count')) || Math.floor(Math.random() * 100) + 450;
            views += Math.floor(Math.random() * 3) + 1;
            let likes = Math.floor(views * 0.08) + Math.floor(Math.random() * 5);
            localStorage.setItem('pdf_views_count', views);
            document.getElementById('viewCount').innerText = views;
            document.getElementById('likeCount').innerText = likes;
        }

        // Модалки
        const regModal = document.getElementById('regModal');
        const imgModal = document.getElementById('imgModal');
        
        const openReg = () => regModal.style.display = 'flex';
        const closeReg = () => regModal.style.display = 'none';
        
        const openImg = () => {
            document.getElementById('fullImg').src = MY_DOCUMENT.image;
            imgModal.style.display = 'flex';
        };
        const closeImg = () => imgModal.style.display = 'none';

        document.getElementById('logoBtn').onclick = openReg;
        document.getElementById('regBtn').onclick = openReg;
        document.getElementById('closeModalBtn').onclick = closeReg;
        document.getElementById('imgClick').onclick = openImg;
        imgModal.onclick = closeImg; // Закрыть фото кликом в любое место

        function renderPage() {
            document.getElementById('fileTitle').innerText = MY_DOCUMENT.title;
            document.getElementById('textDisplay').innerText = MY_DOCUMENT.text;
            
            if(MY_DOCUMENT.image) {
                const img = document.getElementById('imgDisplay');
                img.src = MY_DOCUMENT.image;
                img.style.display = 'block';
            } else {
                document.getElementById('imgClick').style.display = 'none';
            }

            const list = document.getElementById('commentList');
            list.innerHTML = MY_DOCUMENT.comments.map(c => `
                <div class="comment-item">
                    <span class="comment-user">${c.user}</span>
                    <div>${c.text}</div>
                </div>
            `).join('');
        }

        window.onload = () => {
            renderPage();
            updateStats();
            setInterval(updateStats, 30000);
        };
    </script>
</body>
</html>
