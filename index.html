<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pechatka | Private Cloud</title>
    <style>
        :root {
            --bg: #0b0f1a;
            --panel: #161b2b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ПЛАШКА ВЕРХУ */
        .header {
            background: var(--panel);
            padding: 0 20px;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(56, 189, 248, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: 800;
            color: var(--accent);
            cursor: pointer;
            font-size: 1.2rem;
        }

        .nav-btns button {
            background: var(--accent);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* КОНТЕНТ */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .post-container {
            width: 100%;
            max-width: 700px;
            background: var(--panel);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .post-text { line-height: 1.6; font-size: 1.1rem; }
        .post-img { width: 100%; border-radius: 10px; margin: 20px 0; }

        /* СТАТИСТИКА */
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8;
        }

        /* АДМИН ПАНЕЛЬ (СКРЫТА) */
        .admin-zone {
            display: none;
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px dashed var(--accent);
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #0f172a;
            color: white;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        /* ОКНО РЕГИСТРАЦИИ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .reg-box {
            background: var(--panel);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
        }

    </style>
</head>
<body>

    <nav class="header">
        <div class="logo" onclick="showReg()">3D PECHATKA PRO</div>
        <div class="nav-btns">
            <button onclick="showReg()">Войти / Регистрация</button>
        </div>
    </nav>

    <div class="main-content">
        <div class="post-container">
            
            <button id="adminBtn" style="display:none; margin-bottom: 10px;" onclick="toggleAdmin()">⚙️ Панель управления</button>
            
            <div id="editor" class="admin-zone">
                <h3>Создать документ</h3>
                <textarea id="inputText" placeholder="Введите текст сообщения..."></textarea>
                <input type="text" id="inputImg" placeholder="Ссылка на фото (URL)" style="width:100%; margin-bottom:10px;">
                <button onclick="savePost()">Опубликовать</button>
            </div>

            <div id="postContent">
                <h1 id="titleDisplay">Добро пожаловать</h1>
                <p class="post-text" id="textDisplay">Здесь будет ваш защищенный контент...</p>
                <img src="" id="imgDisplay" class="post-img" style="display:none;">
            </div>

            <div class="stats">
                <span>👁 Просмотры: <b id="viewCount">0</b></span>
                <span>❤️ Лайки: <b id="likeCount">0</b></span>
            </div>

            <div id="comments" style="margin-top:40px;">
                <h4>Комментарии:</h4>
                <div id="commentList"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="regModal">
        <div class="reg-box">
            <h2>Регистрация</h2>
            <p>Ваша заявка отправлена. Дождитесь одобрения администратора.</p>
            <button onclick="closeReg()">Понятно</button>
            <p style="font-size:0.7rem; margin-top:20px; color:#475569;" onclick="beAdmin()">Вход для персонала</p>
        </div>
    </div>

    <script>
        // ЛОГИКА ПРОСМОТРОВ
        let views = parseInt(localStorage.getItem('fakeViews')) || Math.floor(Math.random() * 100) + 450;
        
        function updateViews() {
            views += Math.floor(Math.random() * 50);
            document.getElementById('viewCount').innerText = views;
            localStorage.setItem('fakeViews', views);
        }
        setInterval(updateViews, 15000 * 60); // Раз в 15 минут
        updateViews();

        // ЛОГИКА ПОСТОВ
        function savePost() {
            const text = document.getElementById('inputText').value;
            const img = document.getElementById('inputImg').value;
            
            localStorage.setItem('savedText', text);
            localStorage.setItem('savedImg', img);
            loadPost();
            toggleAdmin();
        }

        function loadPost() {
            const t = localStorage.getItem('savedText');
            const i = localStorage.getItem('savedImg');
            if(t) document.getElementById('textDisplay').innerText = t;
            if(i) {
                document.getElementById('imgDisplay').src = i;
                document.getElementById('imgDisplay').style.display = 'block';
            }
        }

        // АДМИНКА
        function beAdmin() {
            let pass = prompt("Введите пароль администратора:");
            if(pass === "1234") { // Секретный пароль
                document.getElementById('adminBtn').style.display = "block";
                closeReg();
            }
        }

        function toggleAdmin() {
            const az = document.getElementById('editor');
            az.style.display = az.style.display === "block" ? "none" : "block";
        }

        function showReg() { document.getElementById('regModal').style.display = "flex"; }
        function closeReg() { document.getElementById('regModal').style.display = "none"; }
        
        window.onload = loadPost;
    </script>
</body>
</html>
